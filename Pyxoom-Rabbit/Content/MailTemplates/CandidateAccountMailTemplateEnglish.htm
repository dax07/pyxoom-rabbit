<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title></title>
    <style type="text/css">
        body {
            font-family: Arial, Verdana, Sans-Serif;
        }

        table tr td {
            text-align: left;
        }

        .regular-text {
            font-size: 12px;
            text-align: justify;
        }

        .container-data-title {
            width: 90px;
            font-size: 13px;
            font-weight: bold;
            padding: 5px;
            border: solid 1px #EAF282;
        }

        .container-data-text {
            font-size: 13px;
            font-weight: bold;
            padding: 5px;
            background: #EAF282;
        }

        .style3 {
            height: 83px;
            width: 211px;
        }
    </style>
</head>
<body>
    <div style="width: 100%; margin: auto; text-align: center;
        padding: 3px;">
        <div>
            <table cellpadding="0" cellspacing="0" width="80%">
                <tr>

                    <td style="width: 80%; background: url(../../Resources/Images/title-bg.png) repeat-x">
                        <h3 style="margin: 0px 0px 5px 0px" align="center">
                            <b>User Account </b>
                        </h3>
                    </td>
                </tr>
                <td colspan="2" class="regular-text" style="padding: 10px 10px 10px 10px" align="left">
                    <br />
                    @mainMessage
                </td>
                </tr>

                <tr>
                    <td colspan="2" style="height: 55px; padding-right: 10px; text-align: right; font-size: 11px;
                        background: url(../../Resources/Images/title-footer-bg.png) repeat-x">
                        <table cellpadding="0" cellspacing="0" align="right">
                            <tr>
                                <td style="background: url(../../Resources/Images/pyxoom-psw.png) repeat-x" class="style3">
                                    <img align="right" alt="PYXOOM" border="0" hspace="0" src="cid:uniqueId" />
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
